name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m belieflab demo > /tmp/demo.json
      - run: python -m belieflab solve examples/sensing.json --belief '[[1,2],[1,2]]' --horizon 2 > /tmp/solve.json
      - run: python -m belieflab update examples/sensing.json --belief '[[1,2],[1,2]]' --action 2 --observation 0
      - run: PYTHONPATH=. python examples/render_audit.py --check
      - run: python -m belieflab feedback-demo > /tmp/feedback.json
      - run: python -m belieflab compare examples/sensing.json --belief '[[1,2],[1,2]]' --horizon 2 > /tmp/compare.json
      - run: python -m belieflab open-loop examples/sensing.json --belief '[[1,2],[1,2]]' --horizon 2 > /tmp/open-loop.json
      - run: PYTHONPATH=. python examples/render_feedback.py --check
      - run: python -m belieflab policy-demo > /tmp/policy.json
      - run: python -m belieflab evaluate-policy examples/sensing.json --belief '[[1,2],[1,2]]' --policy examples/probe-policy.json > /tmp/evaluate-policy.json
      - run: python -m belieflab audit-policy examples/sensing.json --belief '[[1,2],[1,2]]' --policy examples/probe-policy.json > /tmp/audit-policy.json
      - run: PYTHONPATH=. python examples/render_policy.py --check
